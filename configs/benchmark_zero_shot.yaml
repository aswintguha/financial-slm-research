# Master Benchmark Configuration for Phase 05: Zero-Shot SLM Financial Time-Series Forecasting

experiment:
  phase: "Phase 05"
  name: "zero_shot_slm_benchmark"
  protocol_version: "Phased Research Protocol v1.0"
  random_seed: 42

horizons:
  primary: 5
  secondary: 1

context_window: 20

universes:
  core_full_history_count: 146
  secondary_count: 4
  screening_sample_count: 420
  screening_tickers_count: 30

splits:
  validation:
    start_date: "2024-04-09"
    end_date: "2024-10-31"
  test:
    start_date: "2024-11-11"
    end_date: "2025-05-30"

generation:
  temperature: 0.0
  do_sample: false
  max_new_tokens: 32
  precision: "bfloat16"
  device: "mps"

validity_thresholds:
  screening_gate_5_4: 90.0
  backbone_eligibility_gate_5_6: 95.0

tie_breaker_protocol:
  throughput_sample_count: 50
  selection_rule: "First 50 samples of screening cohort sorted lexicographically by (ticker, origin_date)"
  warm_up_runs: 5
  measurement_repetitions: 3
  timing_mode: "generation_only"

